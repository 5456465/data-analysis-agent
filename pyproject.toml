[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analysis-agent"
version = "0.1.0"
description = "A verifiable data analysis agent portfolio project."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5,<2",
    "fastapi>=0.115,<1",
    "langgraph>=1,<2",
    "openai>=1,<3",
    "pandas>=2.2,<3",
    "python-dotenv>=1,<2",
    "streamlit>=1,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
